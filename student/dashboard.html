<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ড্যাশবোর্ড — পরীক্ষা প্রস্তুতি</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

  /* ===== Premium Glassmorphism Theme (Spring Animation) ===== */
  .glass-float-card {
    background: rgba(128, 128, 128, 0.04);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(128, 128, 128, 0.12);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
  }
  @media (hover: hover) {
    .glass-float-card:hover { transform: translateY(-5px); box-shadow: 0 15px 45px rgba(0, 0, 0, 0.06); }
  }

  .btn-glass {
    background: rgba(128, 128, 128, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(128, 128, 128, 0.15);
    border-radius: 14px;
    color: var(--text-primary);
    padding: 12px;
    font-weight: 800;
    font-size: 0.85rem;
    text-align: center;
    flex: 1;
    display: inline-flex; justify-content: center; align-items: center; gap: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.02); text-decoration: none;
    transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .btn-glass:active { transform: scale(0.94); }

  /* ===== Golden XP Hero Card ===== */
  .hero-points-card {
    background: linear-gradient(135deg, #fefce8 0%, #fef08a 100%);
    border: 1px solid rgba(234, 179, 8, 0.3);
    border-radius: 20px;
    padding: 24px;
    color: #713f12; 
    display: flex; align-items: center; justify-content: space-between;
    position: relative; overflow: hidden;
    box-shadow: 0 12px 35px -10px rgba(234, 179, 8, 0.35);
  }
  
  .hero-points-card::after {
    content: ''; position: absolute; top: 0; left: -150%;
    width: 50%; height: 100%;
    background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
    transform: skewX(-25deg); animation: shine 6s infinite cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes shine { 0% { left: -150%; } 20% { left: 150%; } 100% { left: 150%; } }

  .hero-icon-container { filter: drop-shadow(0 8px 12px rgba(113, 63, 18, 0.15)); }
  .top-scorer-badge {
    background: rgba(113, 63, 18, 0.08); border: 1px solid rgba(113, 63, 18, 0.15);
    padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 800;
    margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; color: #713f12;
  }

  /* ===== Modern Level System (Shimmer Bar) ===== */
  .level-card {
    background: linear-gradient(135deg, rgba(37,99,235,0.05), rgba(37,99,235,0.01));
    border: 1px solid rgba(37,99,235,0.15);
    border-radius: 18px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 2px 15px rgba(37,99,235,0.02);
  }
  .level-progress-bg {
    background: rgba(37,99,235,0.12); height: 8px; border-radius: 99px; margin-top: 14px; overflow: hidden; position: relative;
  }
  .level-progress-fill {
    background: linear-gradient(90deg, #3b82f6, #60a5fa); height: 100%; width: 0%; 
    transition: width 1.5s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative; border-radius: 99px;
  }
  .level-progress-fill::after {
    content: ""; position: absolute; top:0; left:0; right:0; bottom:0;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
    animation: barShimmer 2s infinite linear;
  }
  @keyframes barShimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  /* ===== Horizontal Scroll ===== */
  .subject-scroller {
    display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; margin-top: 8px;
  }
  .subject-scroller::-webkit-scrollbar { display: none; }
  .subject-mini-card { min-width: 220px; flex-shrink: 0; }

  /* ===== Point List Styles ===== */
  .point-list-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px dashed var(--surface-border);
  }
  .point-list-row:last-child { border-bottom: none; padding-bottom: 0; }
  .rank-number { width: 22px; font-size: 0.85rem; font-weight: 900; color: var(--text-muted); }

  /* ===== General Utils ===== */
  .trend-bar {
    flex: 1; border-radius: 6px 6px 0 0;
    background: linear-gradient(180deg, var(--color-accent), var(--color-accent-2));
    height: 0%; transition: height 1s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .progress-track { overflow: hidden; background: rgba(128,128,128,0.15); border-radius: 99px; height: 6px; }
  .progress-fill { width: 0%; transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1); height: 100%; border-radius: 99px; background: var(--color-accent); }
  
  .weak-anim { animation: gentlyPulse 3s infinite; }
  @keyframes gentlyPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(0.98); } }
</style>
</head>
<body>
<div class="app-shell" id="shell">
  <div class="state-block"><div class="spinner"></div></div>
</div>

<script type="module">
import { initTheme, toggleTheme, icons, renderState, renderStudentHeader } from "../js/utils/ui-utils.js";
import { getActiveStudent, refreshActiveStudent, getActiveStudents } from "../js/utils/student-utils.js";
import { subscribeToUpcomingExams, getApprovedResults, getStudentResultStatusMap, getStudentRank, getLeaderboardData } from "../js/utils/results-utils.js";
import { getSubjects, getChapters, buildNameMap } from "../js/utils/syllabus-utils.js";
import { computeOverallStats, computeSubjectStats, computeTopicStats } from "../js/utils/analytics-utils.js";
import { generateMotivation } from "../js/utils/motivation-utils.js";

initTheme();
const shell = document.getElementById("shell");
let student = getActiveStudent();

if (!student) {
  window.location.href = "../index.html";
} else {
  refreshActiveStudent(student.docId).then(fresh => {
    if (fresh) student = fresh;
    render();
  });
}

function animateCountUp(el, target, duration = 800) {
  if (!el || typeof target !== "number" || isNaN(target)) return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { el.textContent = target; return; }
  const start = performance.now();
  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(target * eased);
    if (t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ===== XP to Level Calculator =====
function getLevelInfo(xp) {
  const levels = [0, 1000, 3000, 6000, 10000, 15000, 25000, 40000, 60000];
  let currentLevel = 1;
  for(let i = 0; i < levels.length; i++) {
     if(xp >= levels[i]) currentLevel = i + 1;
  }
  const currentThreshold = levels[currentLevel - 1];
  const nextThreshold = levels[currentLevel] || levels[levels.length - 1];
  
  const progressXP = xp - currentThreshold;
  const targetXP = nextThreshold - currentThreshold;
  const percentage = targetXP === 0 ? 100 : Math.min(100, Math.max(0, (progressXP / targetXP) * 100));
  
  return { 
    level: currentLevel, 
    nextLevel: currentLevel + 1, 
    xpNeeded: nextThreshold - xp, 
    percentage: Math.round(percentage), 
    isMax: currentLevel === levels.length 
  };
}

async function render() {
  shell.innerHTML = `
    ${renderStudentHeader(student, "dashboard")}
    
    <div class="mt-4 flex gap-2">
      <a href="../student/analytics.html" class="btn-glass">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 9l-5 5-3-3-5 5"/></svg>
        বিশ্লেষণ
      </a>
      <a href="../student/comparison.html" class="btn-glass">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        তুলনা
      </a>
    </div>

    <!-- Upcoming Exams Section -->
    <div id="upcomingSection" class="mt-5" style="display: none;"></div>
    
    <!-- Hero Points & Level Section -->
    <div id="pointsHeroSection" class="mt-5"></div>
    
    <!-- Motivation Section -->
    <div id="motivationSection" class="mt-4"></div>
    
    <!-- Leaderboard Top 3 -->
    <div id="pointListSection" class="mt-5"></div>
    
    <!-- Statistics -->
    <div id="statsSection" class="mt-5"></div>
    
    <!-- Subject Performance -->
    <div id="subjectSection" class="mt-5"></div>
    
    <!-- Weak Topics -->
    <div id="weakTopicSection" class="mt-5 mb-5"></div>
  `;
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);

  loadUpcoming();
  loadMotivation();
  loadPerformanceAndLeaderboard();
}

let unsubscribeUpcoming = null;
async function loadUpcoming() {
  const el = document.getElementById("upcomingSection");
  try {
    const [subjects, chapters, resultMap] = await Promise.all([
      getSubjects(), getChapters(), getStudentResultStatusMap(student.studentId)
    ]);
    const subjectMap = buildNameMap(subjects);
    const chapterMap = buildNameMap(chapters);

    if (unsubscribeUpcoming) unsubscribeUpcoming();
    unsubscribeUpcoming = subscribeToUpcomingExams(
      (exams) => renderUpcomingExams(el, exams, subjectMap, chapterMap, resultMap),
      (err) => { console.error(err); el.style.display = "none"; }
    );
  } catch (err) {
    console.error(err);
    el.style.display = "none";
  }
}

// ===== Upcoming Exams (with Max XP Update) =====
function renderUpcomingExams(el, exams, subjectMap, chapterMap, resultMap) {
  const now = new Date().getTime();

  const filteredExams = exams.filter(exam => {
    const pubTime = exam.publishDate?.toDate ? exam.publishDate.toDate().getTime() : 0;
    if (pubTime > now) return false;
    const target = exam.targetBatch || "all";
    if (target !== "all" && target !== student.className) return false;
    const allowed = exam.allowedStudents || [];
    if (allowed.length > 0 && !allowed.includes(student.studentId)) return false;
    return true;
  });

  if (filteredExams.length === 0) {
    el.style.display = "none"; 
    el.innerHTML = "";
    return;
  }

  el.style.display = "block"; 
  el.innerHTML = `<div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <p class="eyebrow" style="margin:0;">আসন্ন পরীক্ষা</p>
                  </div>` 
  + filteredExams.map(exam => {
    const dateStr = exam.examDate?.toDate ? exam.examDate.toDate().toLocaleDateString("bn-BD", { day: "numeric", month: "long", year: "numeric" }) : "";
    const own = resultMap[exam.id];
    let actionHtml = "";
    
    if (own?.status === "approved") {
      actionHtml = `<a href="../student/result.html?resultId=${own.resultId}" class="btn-glass mt-3" style="width:100%; border-color:var(--color-success); color:var(--color-success);">ফলাফল দেখুন</a>`;
    } else if (own?.status === "pending") {
      actionHtml = `<p class="text-xs text-muted mt-3 text-center" style="font-weight:700;">জমা দেওয়া হয়েছে — অনুমোদনের অপেক্ষায়।</p>`;
    } else if (exam.status === "published") {
      actionHtml = `<a href="../student/exam.html?examId=${exam.id}" class="btn-glass mt-3" style="width:100%; background:linear-gradient(135deg, var(--color-accent), #f59e0b); color:#fff; border:none; box-shadow: 0 4px 15px rgba(var(--color-accent-rgb),0.3); font-weight:900; letter-spacing:0.5px;">পরীক্ষা শুরু করুন</a>`;
    }
    
    const isSpecial = (exam.allowedStudents && exam.allowedStudents.length > 0);
    
    // Calculate Max XP for this exam
    const marks = Number(exam.totalMarks) || 0;
    const qCount = exam.questionIds ? exam.questionIds.length : (marks > 0 ? 1 : 0);
    const maxXP = Math.round((marks * 10) + 50 + (qCount * 5) + 100);

    return `
      <div class="glass-float-card mt-2" ${isSpecial ? 'style="border-color:var(--color-accent); background:rgba(var(--color-accent-rgb), 0.03);"' : ''}>
        <div class="flex justify-between items-start mb-3">
          <h3 style="font-size:1.15rem; font-weight:900; line-height:1.4;">${exam.name}</h3>
          <span style="background:rgba(37, 99, 235, 0.1); color:#2563eb; font-weight:800; font-size:0.7rem; padding:4px 10px; border-radius:8px; white-space:nowrap; margin-left:12px;">${isSpecial ? "স্পেশাল এক্সাম" : (exam.status === "published" ? "প্রকাশিত" : "আসন্ন")}</span>
        </div>
        
        <div class="grid-2 gap-2">
          <div style="background:rgba(128,128,128,0.05); padding:10px; border-radius:10px;">
             <p class="text-xs text-muted">তারিখ ও সময়</p>
             <p class="text-sm font-bold" style="margin-top:2px;">${dateStr || "—"}</p>
          </div>
          <div style="background:rgba(128,128,128,0.05); padding:10px; border-radius:10px;">
             <p class="text-xs text-muted">সময়কাল</p>
             <p class="text-sm font-bold" style="margin-top:2px;">${exam.durationMinutes ? exam.durationMinutes + " মিনিট" : "—"}</p>
          </div>
          
          <!-- Modern Max XP Badge inside Exam Card -->
          <div style="background:linear-gradient(135deg, rgba(234,179,8,0.08), rgba(245,158,11,0.03)); padding:12px 16px; border-radius:10px; grid-column: span 2; display:flex; justify-content:space-between; align-items:center; border: 1px dashed rgba(234, 179, 8, 0.3);">
             <div style="display:flex; align-items:center; gap:8px; color:#b45309;">
               <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6 6 1-4 4 1 6-6-3-6 3 1-6-4-4 6-1z"/></svg>
               <span class="text-sm font-bold">এই পরীক্ষায় থাকছে সর্বোচ্চ</span>
             </div>
             <p style="color:#d97706; font-family:var(--font-num); font-size:1.3rem; font-weight:900;">${maxXP} XP</p>
          </div>
        </div>
        ${actionHtml}
      </div>
    `;
  }).join("");
}

async function loadMotivation() {
  const el = document.getElementById("motivationSection");
  try {
    const [rank, results, subjects] = await Promise.all([
      getStudentRank(student.studentId),
      getApprovedResults(student.studentId),
      getSubjects()
    ]);
    if (results.length === 0) return; 

    const overall = computeOverallStats(results);
    const subjectStats = computeSubjectStats(results, buildNameMap(subjects));
    let weakest = null, strongest = null;
    (subjectStats || []).forEach(s => {
      if (!weakest || s.accuracy < weakest.accuracy) weakest = s;
      if (!strongest || s.accuracy > strongest.accuracy) strongest = s;
    });

    const advice = generateMotivation({
      overallPercentage: overall?.avgPercentage,
      rank: rank?.rank,
      totalStudents: rank?.totalStudents,
      examsTaken: overall?.examsTaken ?? results.length,
      weakestSubjectName: weakest?.name,
      weakestSubjectAccuracy: weakest?.accuracy,
      strongestSubjectName: strongest?.name !== weakest?.name ? strongest?.name : null,
      strongestSubjectAccuracy: strongest?.accuracy
    });

    el.innerHTML = `
      <div class="glass-float-card mt-2">
        <p class="text-sm" style="font-weight:900; color: var(--text-primary); margin-bottom:8px; display:flex; align-items:center; gap:6px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          AI বিশ্লেষণ ও পরামর্শ
        </p>
        <p class="text-sm" style="line-height:1.6; color: var(--text-secondary); font-weight:600;">${advice}</p>
      </div>
    `;
  } catch (err) { console.error(err); }
}

async function loadPerformanceAndLeaderboard() {
  const ptsEl = document.getElementById("pointsHeroSection");
  const pointListEl = document.getElementById("pointListSection");
  const statsEl = document.getElementById("statsSection");
  const subjEl = document.getElementById("subjectSection");
  const weakEl = document.getElementById("weakTopicSection");
  
  ptsEl.innerHTML = `<div class="glass-float-card skeleton" style="height:250px;"></div>`;
  statsEl.innerHTML = `<div class="glass-float-card skeleton mt-2" style="height:120px;"></div>`;

  try {
    const [results, rank, allStudents] = await Promise.all([
      getApprovedResults(student.studentId),
      getStudentRank(student.studentId),
      getActiveStudents()
    ]);
    
    let leaderboard = await getLeaderboardData(allStudents);
    leaderboard = leaderboard.sort((a,b) => (Number(b.totalPoints) || 0) - (Number(a.totalPoints) || 0));

    const overall = computeOverallStats(results);
    const totalPoints = rank?.totalPoints || 0;
    const rankText = rank ? `${rank.rank} / ${rank.totalStudents}` : "—";
    const totalQuestions = (overall?.totalCorrect || 0) + (overall?.totalWrong || 0) + (overall?.totalUnanswered || 0);

    // Get Level Information
    const levelInfo = getLevelInfo(totalPoints);

    if (!overall) {
      ptsEl.innerHTML = ""; pointListEl.innerHTML = "";
      statsEl.innerHTML = `
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2.5"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
          <p class="eyebrow" style="margin:0;">পরিসংখ্যান</p>
        </div>`;
      const box = document.createElement("div"); box.className = "mt-2";
      renderState(box, "empty", "এখনো কোনো অনুমোদিত ফলাফল নেই।");
      statsEl.appendChild(box);
      return;
    }

    const topScorer = leaderboard.length > 0 ? leaderboard[0] : null;
    let topScorerText = "";
    if (topScorer) {
      const isMeTop = topScorer.studentId === student.studentId;
      topScorerText = `
        <div class="top-scorer-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          শীর্ষস্থান: ${isMeTop ? "তুমি" : topScorer.name}
        </div>`;
    }

    const cleanTrophySvg = `
      <svg width="65" height="65" viewBox="0 0 24 24" fill="none" stroke="#713f12" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
        <path d="M4 22h16"></path>
        <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
        <path d="M18 2H6v7a6 6 0 0 0 12 0V2z"></path>
      </svg>
    `;

    // ===== Hero Card & Level Progress Bar =====
    ptsEl.innerHTML = `
      <div class="hero-points-card">
        <div>
          <p style="font-size: 0.85rem; font-weight: 800; opacity: 0.85; margin-bottom: 2px;">সর্বমোট অর্জিত পয়েন্ট</p>
          <h2 style="font-size: 2.8rem; font-weight: 900; line-height: 1.1; margin: 0; letter-spacing: -1px; color:#92400e;">
            <span class="num" id="heroTotalPoints">0</span> <span style="font-size:1.2rem;">XP</span>
          </h2>
          <p style="font-size: 0.8rem; font-weight: 800; opacity: 0.9; margin-top: 6px;">
            বর্তমান র‍্যাঙ্ক: <span style="font-family:var(--font-num);">${rankText}</span>
          </p>
          ${topScorerText}
        </div>
        <div class="hero-icon-container">${cleanTrophySvg}</div>
      </div>
      
      <!-- Modern Level Component -->
      <div class="level-card mt-3">
         <div class="flex justify-between items-end">
            <div>
               <div style="display:flex; align-items:center; gap:8px;">
                 <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                 <span style="font-weight:900; font-size:1.15rem; color:#1e3a8a; letter-spacing:0.5px;">Level ${levelInfo.level}</span>
               </div>
               <p style="font-size:0.75rem; color:#3b82f6; margin-top:6px; font-weight:800;">
                 ${levelInfo.isMax ? 'আপনি সর্বোচ্চ লেভেল অর্জন করেছেন!' : `Level ${levelInfo.nextLevel}-এ যেতে আর ${levelInfo.xpNeeded} XP প্রয়োজন`}
               </p>
            </div>
            <div style="font-family:var(--font-num); font-weight:900; font-size:1.3rem; color:#2563eb;">
               ${levelInfo.percentage}%
            </div>
         </div>
         <div class="level-progress-bg">
            <div class="level-progress-fill level-anim" data-w="${levelInfo.percentage}"></div>
         </div>
      </div>
    `;

    const byClass = {};
    leaderboard.forEach(r => {
       const c = r.className || "অনির্ধারিত ক্লাস";
       if (!byClass[c]) byClass[c] = [];
       byClass[c].push(r);
    });

    let classListHtml = `
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <p class="eyebrow" style="margin:0;">ক্লাস র‍্যাঙ্কিং (Top 3)</p>
      </div>`;
      
    for (const [cls, classStudents] of Object.entries(byClass)) {
      const top3 = classStudents.slice(0, 3);
      classListHtml += `
        <div class="glass-float-card mb-3">
          <p style="font-size:0.95rem; font-weight:900; border-bottom:1px solid rgba(128,128,128,0.1); padding-bottom:10px; margin-bottom:6px; color:var(--color-accent);">${cls}</p>
          ${top3.map((s, idx) => `
            <div class="point-list-row">
              <div class="flex items-center gap-3">
                <span class="rank-number">${idx + 1}.</span>
                <span style="font-size:0.95rem; font-weight:${s.studentId === student.studentId ? '900; color:var(--color-accent)' : '700; color:var(--text-secondary)'};">${s.name}${s.studentId === student.studentId ? ' (তুমি)' : ''}</span>
              </div>
              <span class="num" style="font-size:0.9rem; font-weight:900; color:var(--text-primary); background:rgba(128,128,128,0.08); padding:4px 10px; border-radius:8px;">${s.totalPoints} XP</span>
            </div>
          `).join("")}
          ${classStudents.length > 3 ? `<div style="text-align:center; margin-top:16px;"><a href="../student/leaderboard.html" class="btn-glass" style="font-size:0.8rem; padding:8px 16px; border-radius:8px; display:inline-block; width:auto;">সম্পূর্ণ তালিকা দেখুন</a></div>` : ''}
        </div>
      `;
    }
    pointListEl.innerHTML = classListHtml;

    statsEl.innerHTML = `
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
        <p class="eyebrow" style="margin:0;">বিস্তারিত পরিসংখ্যান</p>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="glass-float-card" style="text-align:center; padding:16px;">
           <p class="text-xs text-muted font-bold">মোট পরীক্ষা</p>
           <p class="num" style="font-size:1.6rem;font-weight:900; margin-top:6px;" id="statExams">0</p>
        </div>
        <div class="glass-float-card" style="text-align:center; padding:16px;">
           <p class="text-xs text-muted font-bold">মোট প্রশ্ন ফেস করা</p>
           <p class="num" style="font-size:1.6rem;font-weight:900; margin-top:6px;">${totalQuestions}</p>
        </div>
        <div class="glass-float-card" style="text-align:center; padding:16px;">
           <p class="text-xs text-muted font-bold">সঠিক উত্তর</p>
           <p class="num" style="font-size:1.6rem;font-weight:900; color:var(--color-success); margin-top:6px;">${overall.totalCorrect}</p>
        </div>
        <div class="glass-float-card" style="text-align:center; padding:16px;">
           <p class="text-xs text-muted font-bold">ভুল উত্তর</p>
           <p class="num" style="font-size:1.6rem;font-weight:900; color:var(--color-danger); margin-top:6px;">${overall.totalWrong}</p>
        </div>
        <div class="glass-float-card" style="text-align:center; padding:16px;">
           <p class="text-xs text-muted font-bold">গড় শতাংশ</p>
           <p style="font-size:1.6rem;font-weight:900; margin-top:6px;"><span class="num" id="statAvgPct">0</span>%</p>
        </div>
        <div class="glass-float-card" style="text-align:center; padding:16px;">
           <p class="text-xs text-muted font-bold">গড় সঠিকতা</p>
           <p style="font-size:1.6rem;font-weight:900; margin-top:6px;"><span class="num" id="statAvgAcc">0</span>%</p>
        </div>
      </div>
      ${overall.trend ? `
        <div class="glass-float-card mt-3">
          <p class="text-xs text-muted mb-3" style="font-weight:800;">পারফরম্যান্স গ্রাফ</p>
          <div class="flex items-end gap-2" style="height:70px;">
            ${overall.trend.map(t => `<div class="trend-bar" data-h="${Math.max(6, (t.value || 0))}" title="${t.value ?? '—'}%"></div>`).join("")}
          </div>
        </div>` : ""}
    `;

    const subjects = await getSubjects();
    const subjectMap = buildNameMap(subjects);
    const subjectStats = computeSubjectStats(results, subjectMap);
    
    if (subjectStats.length === 0) {
      subjEl.innerHTML = `<p class="eyebrow">বিষয়ভিত্তিক পারফরম্যান্স</p><p class="text-xs text-muted mt-2">তথ্য নেই।</p>`;
    } else {
      subjEl.innerHTML = `
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          <p class="eyebrow" style="margin:0;">বিষয়ভিত্তিক পারফরম্যান্স</p>
        </div>
        <div class="subject-scroller">
          ${subjectStats.map(s => `
            <div class="glass-float-card subject-mini-card">
              <div class="flex justify-between items-center mb-3">
                <p style="font-weight:800; font-size:0.95rem;">${s.name}</p>
                <p style="font-weight:900; font-family:var(--font-num); color:var(--color-accent); background:rgba(var(--color-accent-rgb),0.1); padding:2px 8px; border-radius:6px;">${s.accuracy ?? "—"}%</p>
              </div>
              <div class="progress-track"><div class="progress-fill subj-progress" data-w="${s.accuracy ?? 0}"></div></div>
              <div class="grid-2 mt-4" style="gap:8px;">
                 <div style="background:rgba(128,128,128,0.06); padding:8px; border-radius:10px; text-align:center;">
                    <span style="font-size:0.65rem; color:var(--text-muted); font-weight:700; display:block;">সঠিক</span>
                    <span class="num" style="font-size:1rem; font-weight:900; color:var(--color-success);">${s.correct}</span>
                 </div>
                 <div style="background:rgba(128,128,128,0.06); padding:8px; border-radius:10px; text-align:center;">
                    <span style="font-size:0.65rem; color:var(--text-muted); font-weight:700; display:block;">ভুল</span>
                    <span class="num" style="font-size:1rem; font-weight:900; color:var(--color-danger);">${s.wrong}</span>
                 </div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    const { getTopics } = await import("../js/utils/syllabus-utils.js");
    const topics = await getTopics();
    const topicMap = buildNameMap(topics);
    const topicStats = computeTopicStats(results, topicMap);
    const weakTopics = topicStats.filter(t => t.isWeak);

    weakEl.innerHTML = `<div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                          <p class="eyebrow" style="margin:0;">দুর্বল টপিক নির্দেশক</p>
                        </div>` 
    + (weakTopics.length === 0
      ? `<p class="text-sm text-muted mt-2 font-bold">${topicStats.length === 0 ? "পর্যাপ্ত তথ্য নেই।" : "কোনো ধারাবাহিক দুর্বল টপিক পাওয়া যায়নি।"}</p>`
      : weakTopics.map(t => `
        <div class="glass-float-card weak-anim mt-3" style="border: 1px solid rgba(239, 68, 68, 0.3); background:linear-gradient(135deg, rgba(239,68,68,0.05), transparent);">
          <div class="flex items-center gap-4">
            <span class="icon-btn" style="color:var(--color-danger); background:rgba(239,68,68,0.15); border:none; border-radius:12px; padding:10px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:24px;height:24px;"><path d="M12 3L2.8 20h18.4L12 3z"></path><path d="M12 9v5"></path><path d="M12 17h.01"></path></svg>
            </span>
            <div>
              <p style="font-weight:900; font-size:1rem; color:var(--text-primary);">${t.name ?? "—"}</p>
              <p class="text-xs mt-1" style="color:var(--text-muted); font-weight:700;">সঠিকতার হার মাত্র <span class="num" style="color:var(--color-danger); font-weight:900; font-size:0.9rem;">${t.accuracy}%</span></p>
            </div>
          </div>
        </div>
      `).join(""));

    requestAnimationFrame(() => {
      animateCountUp(document.getElementById("heroTotalPoints"), totalPoints, 1200);
      animateCountUp(document.getElementById("statExams"), Number(overall.examsTaken) || 0, 700);
      if (overall.avgPercentage != null) animateCountUp(document.getElementById("statAvgPct"), Number(overall.avgPercentage) || 0, 800);
      if (overall.avgAccuracy != null) animateCountUp(document.getElementById("statAvgAcc"), Number(overall.avgAccuracy) || 0, 800);
      
      document.querySelectorAll(".trend-bar").forEach(bar => {
        const h = bar.dataset.h || 6;
        requestAnimationFrame(() => { bar.style.height = `${h}%`; });
      });
      document.querySelectorAll(".subj-progress").forEach(bar => {
        const w = bar.dataset.w || 0;
        requestAnimationFrame(() => { bar.style.width = `${w}%`; });
      });
      document.querySelectorAll(".level-anim").forEach(bar => {
        const w = bar.dataset.w || 0;
        requestAnimationFrame(() => { bar.style.width = `${w}%`; });
      });
    });

  } catch (err) {
    console.error(err);
    renderState(statsEl, "error", "পারফরম্যান্স তথ্য লোড করা যায়নি।");
  }
}
</script>
</body>
</html>
